services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: widget
      POSTGRES_PASSWORD: widget
      POSTGRES_DB: widgetdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  migrate:
    build:
      context: ./backend
      target: migrate
    profiles: ["tools"]
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://widget:widget@db:5432/widgetdb

volumes:
  postgres_data:
